<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="gym-booking">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10264a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1020" cy="120" r="210" fill="#2f81f7" fill-opacity="0.12"/>
  <circle cx="1100" cy="520" r="120" fill="#2f81f7" fill-opacity="0.08"/>
  <rect x="80" y="96" width="140" height="8" rx="4" fill="url(#bar)"/>
  <text x="80" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="108" font-weight="700" fill="#ffffff">gym-booking</text>
  <text x="80" y="372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" fill="#c9d1d9">Book your gym slot in a few taps</text>
  <rect x="80" y="470" width="220" height="64" rx="32" fill="#2f81f7" fill-opacity="0.18" stroke="#2f81f7" stroke-opacity="0.6"/>
  <text x="190" y="512" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#ffffff">Web app</text>
</svg>
